name: Verify checkout service navigation
on:
  push:
    branches: [fix/activate-checkout-service-page-20261102]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checkout-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build and validate checkout routing
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify checkout for LocalFresh and sample store
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/kiranapro-preview.log 2>&1 &
          sleep 3
          node scripts/checkout-service-smoke.mjs http://127.0.0.1:4173
