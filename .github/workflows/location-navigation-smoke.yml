name: Diagnose location to storefront navigation
on:
  push:
    branches: [fix/location-navigation-stall-20261030]
permissions:
  contents: read
jobs:
  location-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install runtime and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run guest/location smoke against production and local build
        run: |
          npm run build
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/kp-vite-preview.log 2>&1 &
          sleep 2
          node scripts/location-smoke.mjs https://kiranapro-two.vercel.app || true
          node scripts/location-smoke.mjs http://127.0.0.1:4173
