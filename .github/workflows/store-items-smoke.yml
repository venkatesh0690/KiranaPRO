name: Verify storefront item pages across areas
on:
  push:
    branches: [fix/store-items-page-20261102]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  storefront-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Build and test production + local storefront navigation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/store-items-smoke.mjs https://kiranapro-two.vercel.app || true
          npm run build
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/kp-store-preview.log 2>&1 &
          sleep 3
          node scripts/store-items-smoke.mjs http://127.0.0.1:4173
