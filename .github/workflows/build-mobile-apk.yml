name: Build & Deploy KiranaPRO Mobile App (Android APK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🏗️ Build Web Application Bundle
        run: npm run build

      - name: 🔧 Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: 📱 Sync Capacitor Android Project
        run: npx cap sync android

      - name: 🔨 Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📦 Locate and Rename APK
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/KiranaPRO-v1.0.0.apk
          ls -la output-apk

      - name: 🚀 Upload Mobile APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KiranaPRO-Android-APK
          path: output-apk/KiranaPRO-v1.0.0.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-mobile
          name: "KiranaPRO Mobile App v1.0.0 (Android APK)"
          body: |
            ### 🛒 KiranaPRO Mobile Android Application
            
            Download and install the official KiranaPRO Android APK directly on your phone:
            
            - **📦 File:** `KiranaPRO-v1.0.0.apk`
            - **⚡ Live Cloud Sync:** Connected to `https://kiranapro.vercel.app`
            - **🥬 Features:** LocalFresh mandi (108 items), 20-30 min delivery, enterprise security, and dual store views.
            
            #### How to Install on Android:
            1. Download `KiranaPRO-v1.0.0.apk` on your Android device.
            2. Tap the downloaded file to install (allow "Install from unknown sources" if prompted).
            3. Launch KiranaPRO from your home screen!
          files: output-apk/KiranaPRO-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
