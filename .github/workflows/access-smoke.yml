name: Check KiranaPRO access on mobile and desktop
on:
  push:
    branches: [fix/accessibility-startup-20261031]
permissions:
  contents: read
jobs:
  browser-access:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies and headless Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Inspect live site and local production build
        shell: bash
        run: |
          set -euo pipefail
          echo "== Current production accessibility =="
          node scripts/access-smoke.mjs https://kiranapro-two.vercel.app || true
          echo "== Build verification =="
          npm run build
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/kp-preview.log 2>&1 &
          sleep 2
          echo "== Built app accessibility =="
          node scripts/access-smoke.mjs http://127.0.0.1:4173
