name: Validate uploaded product photos
on:
  push:
    branches:
      - fix/show-uploaded-product-images-20261030
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-image-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate image mappings and production build
        run: |
          set -euo pipefail
          node --version
          npm ci --no-audit --no-fund
          npm run build
