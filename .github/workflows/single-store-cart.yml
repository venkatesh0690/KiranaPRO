name: Test one-store shopping cart
on:
  push:
    branches: [fix/enforce-single-store-cart-20261102]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  single-store-cart:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build and run cart security tests
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Chromium for storefront test
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test guest shopping in both store orders
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/kp-vite.log 2>&1 &
          sleep 2
          node scripts/single-store-cart-smoke.mjs http://127.0.0.1:4173
