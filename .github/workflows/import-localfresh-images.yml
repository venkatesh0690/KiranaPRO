name: Import reviewed LocalFresh catalog assets
on:
  push:
    branches:
      - feature/complete-product-images
    paths:
      - .github/workflows/import-localfresh-images.yml

permissions:
  contents: write

jobs:
  import-reviewed-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/complete-product-images
          persist-credentials: true
      - name: Download pinned user-supplied ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --output localapp.zip \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3J2Acc9rL2BydDWyTKZVzLzwlFB/e02992c7-9cf0-4b58-b84c-9382ad8b8ab0.zip'
          echo '4bd6296b1d9f1847ce2a609b27b725aca1a9dcb7c0072f502ef362b6b06f3fb1  localapp.zip' | sha256sum --check --status
          python3 - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('localapp.zip') as z:
            for item in z.infolist():
              p=pathlib.PurePosixPath(item.filename)
              if (len(p.parts)!=1 or p.suffix!='.webp' or item.is_dir()
                  or item.file_size>1000000):
                raise SystemExit('Unexpected ZIP entry: '+item.filename)
            z.extractall('kiranapro-update')
          PY
      - name: Install exactly 49 reviewed illustrations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash ./scripts/apply-feature-complete-product-images.sh ./kiranapro-update
      - name: Verify app build and tests
        run: |
          npm ci
          npm run build
      - name: Push generated asset commit
        shell: bash
        run: git push origin HEAD:feature/complete-product-images
